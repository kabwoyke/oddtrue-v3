repos:
  - repo: local
    hooks:
      - id: scan-secrets
        name: scan for secrets
        entry: python scripts/scan_secrets.py
        language: system
        pass_filenames: true
      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
