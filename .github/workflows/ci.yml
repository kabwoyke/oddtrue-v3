name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oddtrue
          POSTGRES_PASSWORD: oddtrue_dev
          POSTGRES_DB: oddtrue
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U oddtrue" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: secret scan
        run: python scripts/scan_secrets.py $(git ls-files)
      - run: ruff check .
      - run: mypy
      - name: tests, with coverage collected in the same run
        run: pytest -q --cov=oddtrue --cov-branch
        env:
          CI: "true"  # database tests must run in CI, never skip
      - name: 100% branch coverage on pure math (Phase 1 and 4 exit)
        run: >-
          coverage report --fail-under=100
          --include="src/oddtrue/pricing/*,src/oddtrue/allocation/*,src/oddtrue/reconciliation/diff.py,src/oddtrue/reconciliation/expected.py,src/oddtrue/reconciliation/snapshot.py"
      - name: at least 98% on exchanges, ledger, engine, recovery, reconciliation, safety, observability
        run: >-
          coverage report --fail-under=98
          --include="src/oddtrue/exchanges/*,src/oddtrue/ledger/*,src/oddtrue/execution/*,src/oddtrue/recovery/*,src/oddtrue/reconciliation/*,src/oddtrue/safety/*,src/oddtrue/observability/*"
