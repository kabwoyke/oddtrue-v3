name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: secret scan
        run: python scripts/scan_secrets.py $(git ls-files)
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: 100% branch coverage on pure math (CLAUDE.md phase 1 exit)
        run: pytest -q --cov=oddtrue.pricing --cov=oddtrue.allocation --cov-branch --cov-fail-under=100
