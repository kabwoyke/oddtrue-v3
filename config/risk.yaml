# Risk configuration. All numbers are decimals written as STRINGS (floats are rejected by the loader).
# Values marked PROVISIONAL are placeholders for open decision #12 and must be tuned in Phases 6-7.

mode: "paper"            # paper | testnet | live-min | live
live_enabled: false      # one of three gates for live (env var + this flag + allowlist)
live_allowlist: []       # client ids permitted in live / live-min

client_trade_pct: "0.95"       # active execution allocation: U x 0.95
client_reserve_pct: "0.05"     # reserve: U x 0.05, not auto-spent
market_liquidity_pct: "0.90"   # max share of executable liquidity consumed per opportunity (all clients)

max_slippage: "0.002"          # PROVISIONAL: 0.2% from best price
min_net_roi: "0.30"            # PROVISIONAL: percent, after all costs and final revalidation
live_min_max_notional_usdt: "10"

op_timeout_s: 10               # PROVISIONAL: per-operation hard limit (spec 37)
recovery_timeout_s: 120        # PROVISIONAL

max_exposure_per_client_usdt: "1000"    # PROVISIONAL
max_exposure_global_usdt: "50000"       # PROVISIONAL
settlement_method: "preheld_inventory"  # preheld_inventory | transfer_to_borrow_side | buy_on_borrow_side (D-027 supersedes D-020)
margin_mode: "cross"                     # provisional, verify in Phase 5 (D-021)

# Execution and recovery (Phase 3), all PROVISIONAL (decision #12)
max_book_age_s: "2"                  # order book older than this fails the pre-check
execution_timeout_s: 30              # hard bound for the whole EXECUTING phase
unknown_resolve_attempts: 3          # queries by client order id before an order is deemed never placed
unknown_resolve_backoff_s: "0.5"
expected_loan_seconds: 60            # loan duration assumed in the interest estimate
repay_attempts: 3                    # repay passes (interest keeps accruing while we repay)
recovery_slippage_ladder: ["0.002", "0.005", "0.01"]   # escalating cover (D-026); last value is the hard cap

# Reconciliation, kill switches and alerting (Phase 4), all PROVISIONAL (decision #12)
reconcile_tolerance_coin: "0.00000001"   # largest per-asset coin difference treated as rounding
reconcile_tolerance_usdt: "0.01"
min_reserve_usdt: "10"                   # idle borrow-side USDT below this pages (the 5% reserve must stay usable)
loan_open_alert_s: 300                   # a loan open longer than this pages
exchange_failure_threshold: 5            # consecutive failures that auto-halt that one exchange
alert_dedupe_s: 60                       # identical alerts inside this window are counted, not re-sent
